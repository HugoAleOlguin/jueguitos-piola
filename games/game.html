<!DOCTYPE html>
<html lang="es">
<!--
============================================================================
GAME.HTML - PLANTILLA UNIVERSAL PARA PÁGINAS DE JUEGOS
============================================================================

Esta es la ÚNICA página que necesitás para mostrar cualquier juego.
El contenido se carga dinámicamente desde games.js usando el parámetro "id" de la URL.

EJEMPLO DE USO:
  game.html?id=lethal-company  →  Muestra la página de Lethal Company
  game.html?id=content-warning →  Muestra la página de Content Warning

¿CÓMO FUNCIONA?
  1. El navegador abre esta página con un ?id=xxx en la URL
  2. El script game-loader.js lee ese ID
  3. Busca el juego en games.js
  4. Renderiza todo el contenido dinámicamente

============================================================================
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- El título se actualiza dinámicamente con JavaScript -->
    <title>Juego | Jueguitos Piola</title>

    <meta name="referrer" content="no-referrer">
    
    <!-- SEO Meta Tags - Defaults (updated dynamically) -->
    <meta name="description"
        content="Descarga este juego gratis en Jueguitos Piola. Descargas directas, tutoriales y mods.">
    <meta name="theme-color" content="#020202">

    <!-- Open Graph / Facebook - Defaults (updated dynamically) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hugoaleolguin.github.io/jueguitos-piola/games/game.html">
    <meta property="og:title" content="Jueguitos Piola - Descargar Juegos Gratis">
    <meta property="og:description"
        content="Descarga juegos para PC gratis con descargas directas, tutoriales y mods.">
    <meta property="og:image" content="https://hugoaleolguin.github.io/jueguitos-piola/favicon.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:site_name" content="Jueguitos Piola">
    <meta property="og:locale" content="es_AR">

    <!-- Twitter Card - (updated dynamically) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@HugoAleOlguin">
    <meta name="twitter:title" content="Jueguitos Piola">
    <meta name="twitter:description" content="Descarga juegos gratis para PC">
    <meta name="twitter:image" content="https://hugoaleolguin.github.io/jueguitos-piola/favicon.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://hugoaleolguin.github.io/jueguitos-piola/games/game.html">

    <!-- Estilos y fuentes -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="icon" href="../favicon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    
    <!-- Social Meta Helper - Load FIRST to update meta tags ASAP for crawlers -->
    <script src="../assets/js/games.js"></script>
    <script src="../assets/js/social-meta-helper.js"></script>
</head>

<body>
    <!-- ================================================================
         HEADER - Igual que index.html para consistencia
         ================================================================ -->
    <header>
        <div class="logo">
            <a href="../index.html" style="text-decoration:none; color:inherit;">JUEGUITOS PIOLA</a>
            <span style="font-size: 0.5em; color: var(--secondary-color); vertical-align: super;">BETA</span>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar juegos...">
            </div>
            <!-- Botón Configuración Avanzada -->
            <button class="theme-toggle" id="settingsToggle" title="Configuración">
                ⚙️
            </button>
        </div>
    </header>

    <!-- ================================================================
         CONTENIDO PRINCIPAL
         Este div se llena dinámicamente con game-loader.js
         ================================================================ -->
    <main>
        <div id="game-container">
            <!-- Estado de carga inicial -->
            <div class="game-detail-container" style="text-align: center; padding: 4rem;">
                <p style="color: #666; font-size: 1.2rem;">Cargando juego...</p>
            </div>
        </div>
    </main>

    <!-- ================================================================
         FOOTER - Igual para todas las páginas
         ================================================================ -->
    <footer>
        <p>© 2026 Jueguitos Piola.</p>
    </footer>

    <!-- Modal de Configuración (Include same structure as index) -->
    <div class="settings-modal-overlay" id="settingsModal">
        <div class="settings-modal">
            <div class="settings-header">
                <h2>Configuración</h2>
                <button class="btn-close" id="btnCancelSettings">×</button>
            </div>

            <div class="settings-body">
                <!-- Sección Fondo -->
                <div class="settings-section">
                    <h3>🎨 Apariencia</h3>
                    <div class="form-group">
                        <label for="settingBgUrl">Fondo Personalizado (URL)</label>
                        <input type="text" id="settingBgUrl" placeholder="https://ejemplo.com/imagen.jpg">
                    </div>
                    <div class="form-group">
                        <label for="settingBgFile" class="custom-file-upload">
                            📂 Subir imagen <span style="font-size: 0.8em; opacity: 0.7; margin-left: 5px;">(Máx
                                3MB)</span>
                        </label>
                        <input type="file" id="settingBgFile" accept="image/*" style="display:none;">
                    </div>
                    <div class="preview-box" id="settingBgPreview">
                        <span>Vista Previa</span>
                    </div>
                </div>

                <!-- Sección Estilo Visual -->
                <div class="settings-section">
                    <h3>✨ Estilo Visual</h3>
                    <div class="form-group">
                        <label for="settingBlur">Intensidad de Desenfoque (Blur)</label>
                        <input type="range" id="settingBlur" min="0" max="20" step="1" value="0" style="width: 100%;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.8em; color: #888;">
                            <span>Nítido</span>
                            <span>Muy Borroso</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Color de Acento (Neon)</label>
                        <div class="color-presets">
                            <!-- Presets -->
                            <button class="color-btn" style="--bg: #00f3ff" data-color="#00f3ff"
                                title="Cyan Cyberpunk"></button>
                            <button class="color-btn" style="--bg: #bc13fe" data-color="#bc13fe"
                                title="Magenta Neon"></button>
                            <button class="color-btn" style="--bg: #00ff88" data-color="#00ff88"
                                title="Verde Matrix"></button>
                            <button class="color-btn" style="--bg: #ff9500" data-color="#ff9500"
                                title="Naranja Ámbar"></button>
                            <button class="color-btn" style="--bg: #ff4757" data-color="#ff4757"
                                title="Rojo Glitch"></button>

                            <!-- Custom -->
                            <div class="custom-color-wrapper" title="Color Personalizado">
                                <input type="color" id="settingColor" value="#00f3ff">
                            </div>
                        </div>
                    </div>
                </div>


            </div>

            <div class="settings-footer">
                <button class="btn-text" id="btnResetSettings">Restaurar</button>
                <div style="flex: 1;"></div>
                <button class="button" id="btnSaveSettings">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- ================================================================
         SCRIPTS
         Primero cargamos los datos (games.js), luego el renderizador
         ================================================================ -->
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/settings.js"></script>
    <script src="../assets/js/games.js?v=2"></script>
    <script src="../assets/js/game-loader.js?v=2"></script>

    <!-- Búsqueda redirige al index -->
    <script>
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                window.location.href = '../index.html?search=' + encodeURIComponent(e.target.value.trim());
            }
        });
    </script>
</body>

</html>
