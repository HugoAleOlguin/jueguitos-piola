<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jueguitos Piola</title>
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Descarga los mejores juegos cooperativos, de terror y party para jugar con amigos. Enlaces directos, sin publicidad molesta y con tutoriales de instalación.">
    <meta name="keywords"
        content="juegos gratis, descargar juegos, juegos cooperativos, juegos para pc, juegos livianos, radmin vpn, juegos online, jueguitos piola">
    <meta name="author" content="HugoAleOlguin">
    <meta name="theme-color" content="#020202">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hugoaleolguin.github.io/jueguitos-piola/">
    <meta property="og:title" content="Jueguitos Piola | Juegos Coop y Multiplayer Gratis">
    <meta property="og:description"
        content="La mejor colección de juegos para viciar con los pibes. Descargas directas, tutoriales y mods.">
    <meta property="og:image" content="https://hugoaleolguin.github.io/jueguitos-piola/favicon.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://hugoaleolguin.github.io/jueguitos-piola/">
    <meta property="twitter:title" content="Jueguitos Piola | Juegos Gratis">
    <meta property="twitter:description"
        content="Descarga juegos para PC gratis y rápido. Ideal para jugar en LAN o Online con amigos.">
    <meta property="twitter:image" content="https://hugoaleolguin.github.io/jueguitos-piola/favicon.png">

    <link rel="canonical" href="https://hugoaleolguin.github.io/jueguitos-piola/">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <!-- Botón Configuración Avanzada -->
    <style>
        /* Small fix for settings button position if needed */
    </style>
</head>

<body>

    <header>
        <div class="logo">JUEGUITOS PIOLA</div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar juegos...">
            </div>
            <!-- Botón Configuración Avanzada -->
            <button class="theme-toggle" id="settingsToggle" title="Configuración">
                ⚙️
            </button>
        </div>
    </header>

    <!-- Modal de Configuración -->
    <div class="settings-modal-overlay" id="settingsModal">
        <div class="settings-modal">
            <div class="settings-header">
                <h2>Configuración</h2>
                <button class="btn-close" id="btnCancelSettings">×</button>
            </div>

            <div class="settings-body">
                <!-- Sección Fondo -->
                <div class="settings-section">
                    <h3>🎨 Apariencia</h3>
                    <div class="form-group">
                        <label for="settingBgUrl">Fondo Personalizado (URL)</label>
                        <input type="text" id="settingBgUrl" placeholder="https://ejemplo.com/imagen.jpg">
                    </div>
                    <div class="form-group">
                        <label for="settingBgFile" class="custom-file-upload">
                            📂 Subir imagen
                        </label>
                        <input type="file" id="settingBgFile" accept="image/*" style="display:none;">
                    </div>
                    <div class="preview-box" id="settingBgPreview">
                        <span>Vista Previa</span>
                    </div>
                </div>

                <!-- Sección Estilo Visual -->
                <div class="settings-section">
                    <h3>✨ Estilo Visual</h3>
                    <div class="form-group">
                        <label for="settingBlur">Intensidad de Desenfoque (Blur)</label>
                        <input type="range" id="settingBlur" min="0" max="20" step="1" value="0" style="width: 100%;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.8em; color: #888;">
                            <span>Nítido</span>
                            <span>Muy Borroso</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Color de Acento (Neon)</label>
                        <div class="color-presets">
                            <!-- Presets -->
                            <button class="color-btn" style="--bg: #00f3ff" data-color="#00f3ff"
                                title="Cyan Cyberpunk"></button>
                            <button class="color-btn" style="--bg: #bc13fe" data-color="#bc13fe"
                                title="Magenta Neon"></button>
                            <button class="color-btn" style="--bg: #00ff88" data-color="#00ff88"
                                title="Verde Matrix"></button>
                            <button class="color-btn" style="--bg: #ff9500" data-color="#ff9500"
                                title="Naranja Ámbar"></button>
                            <button class="color-btn" style="--bg: #ff4757" data-color="#ff4757"
                                title="Rojo Glitch"></button>

                            <!-- Custom -->
                            <div class="custom-color-wrapper" title="Color Personalizado">
                                <input type="color" id="settingColor" value="#00f3ff">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sección Temas Guardados -->
                <div class="settings-section">
                    <h3>💾 Temas Guardados</h3>
                    <div class="form-group" style="display: flex; gap: 10px;">
                        <input type="text" id="presetName" placeholder="Nombre del tema..." style="flex: 1;">
                        <button class="button" id="btnSavePreset" style="padding: 0.5rem 1rem;">Guardar</button>
                    </div>
                    <div class="presets-grid" id="presetsGrid">
                        <!-- Los presets se generarán aquí -->
                        <div class="preset-empty"
                            style="text-align: center; padding: 20px; color: #666; font-style: italic;">
                            No hay temas guardados
                        </div>
                    </div>
                </div>


            </div>

            <div class="settings-footer">
                <button class="btn-text" id="btnResetSettings">Restaurar</button>
                <div style="flex: 1;"></div>
                <button class="button" id="btnSaveSettings">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <main>
        <div class="games-grid" id="gamesGrid">
            <!-- Los juegos se cargarán aquí dinámicamente -->
        </div>

        <!-- Vista de Detalle de Juego (SPA) -->
        <div id="game-view" style="display: none; animation: fadeIn 0.5s ease;">
            <!-- El contenido del juego se renderiza aquí -->
            <div id="game-container"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Jueguitos Piola.</p>
    </footer>

    <!-- Scripts con defer para no bloquear el renderizado inicial -->
    <script src="assets/js/games.js"></script>
    <script src="assets/js/app.js" defer></script>
    <script src="assets/js/theme.js?v=VOID" defer></script>
    <script src="assets/js/settings.js" defer></script>

</body>

</html>
