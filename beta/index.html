<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jueguitos Piola | Beta</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <!-- Aplicar tema oscuro inmediatamente (antes del render) -->
    <script>
        if (localStorage.getItem('jueguitosTheme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>

<body>

    <header>
        <div class="logo">JUEGUITOS PIOLA <span
                style="font-size: 0.5em; color: var(--secondary-color); vertical-align: super;">BETA</span></div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar juegos...">
            </div>
            <!-- Botón para cambiar entre tema claro/oscuro -->
            <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
                🌙
            </button>
        </div>
    </header>

    <main>
        <div class="games-grid" id="gamesGrid">
            <!-- Los juegos se cargarán aquí dinámicamente -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Jueguitos Piola.</p>
    </footer>

    <!-- Scripts con defer para no bloquear el renderizado inicial -->
    <script src="assets/js/games.js"></script>
    <script src="assets/js/app.js" defer></script>
    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/music.js" defer></script>

</body>

</html>
