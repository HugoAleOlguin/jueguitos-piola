<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jueguitos Piola | Beta</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <!-- Botón Configuración Avanzada -->
    <style>
        /* Small fix for settings button position if needed */
    </style>
</head>

<body>

    <header>
        <div class="logo">JUEGUITOS PIOLA <span
                style="font-size: 0.5em; color: var(--secondary-color); vertical-align: super;">BETA</span></div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar juegos...">
            </div>
            <!-- Botón Configuración Avanzada -->
            <button class="theme-toggle" id="settingsToggle" title="Configuración">
                ⚙️
            </button>
        </div>
    </header>

    <!-- Modal de Configuración -->
    <div class="settings-modal-overlay" id="settingsModal">
        <div class="settings-modal">
            <div class="settings-header">
                <h2>Configuración</h2>
                <button class="btn-close" id="btnCancelSettings">×</button>
            </div>

            <div class="settings-body">
                <!-- Sección Fondo -->
                <div class="settings-section">
                    <h3>🎨 Apariencia</h3>
                    <div class="form-group">
                        <label for="settingBgUrl">Fondo Personalizado (URL)</label>
                        <input type="text" id="settingBgUrl" placeholder="https://ejemplo.com/imagen.jpg">
                    </div>
                    <div class="form-group">
                        <label for="settingBgFile" class="custom-file-upload">
                            📂 Subir imagen <span style="font-size: 0.8em; opacity: 0.7; margin-left: 5px;">(Máx
                                3MB)</span>
                        </label>
                        <input type="file" id="settingBgFile" accept="image/*" style="display:none;">
                    </div>
                    <div class="preview-box" id="settingBgPreview">
                        <span>Vista Previa</span>
                    </div>
                </div>


            </div>

            <div class="settings-footer">
                <button class="btn-text" id="btnResetSettings">Restaurar</button>
                <div style="flex: 1;"></div>
                <button class="button" id="btnSaveSettings">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <main>
        <div class="games-grid" id="gamesGrid">
            <!-- Los juegos se cargarán aquí dinámicamente -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Jueguitos Piola.</p>
    </footer>

    <!-- Scripts con defer para no bloquear el renderizado inicial -->
    <script src="assets/js/games.js"></script>
    <script src="assets/js/app.js" defer></script>
    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/settings.js" defer></script>

</body>

</html>
